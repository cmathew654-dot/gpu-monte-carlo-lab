Reject generic fintech card sprawl, purple-SaaS aesthetics, false precision,
alarmist failure language, or caveats hidden for visual cleanliness. Return
prioritized findings with exact UI/copy evidence, affected audience, and a
concrete acceptance criterion.
"""
