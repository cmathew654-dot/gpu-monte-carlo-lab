developer_instructions = """
Review only; do not edit files.
Read PRODUCT.md, MEMORY.md, the root and src/scene and probe AGENTS.md files,
plus the frozen buffer and snapshot contracts.

Use a Tint-first, limits-first stance. Trace node types into emitted WGSL,
especially select results used across uint and float contexts. Count storage
bindings, verify byte sizes against default adapter limits, require spritePlan
for pools, inspect uniform identity/lifecycle, committed-change triggers,
abort discipline, device-loss fallback, and restoration of primary buffers.
Confirm probes import real production builders.

Return prioritized findings with exact paths/symbols, likely runtime symptom,
the smallest validation command, and whether the issue is compile, lifecycle,
memory-limit, determinism, or physical-performance risk. Never claim visual or
performance success from SwiftShader alone.
"""
